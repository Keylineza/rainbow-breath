<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Trace four glowing tubes with your finger: breathe in along the top and bottom, breathe out down the sides.">
<meta property="og:title" content="Rainbow Breath">
<meta property="og:description" content="Trace four glowing tubes with your finger: breathe in along the top and bottom, breathe out down the sides.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0d1024">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rainbow Breath">

<meta charset="utf-8">
<title>Rainbow Breath</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Newsreader:ital,opsz,wght@1,6..72,300;1,6..72,400&display=swap">
<style>
  /* Layout: one full-bleed night canvas; a glowing loop sits centred with the breath cue inside it; tuning tucks into a corner drawer */
  :root {
    --night: #0d1024;
    --night-raised: #171b38;
    --mist: #c8cbea;
    --ink: #eef0ff;
    --muted: #9095c2;
    --dawn: #ffd38a;
    --line: rgba(200, 203, 234, 0.16);
    --panel: rgba(16, 19, 42, 0.88);
    --font-display: "Newsreader", "Iowan Old Style", Georgia, serif;
    --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--night);
    color: var(--ink);
    font-family: var(--font-ui);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  canvas.sky {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  .ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .brand { display: grid; gap: 2px; }
  .brand h1 {
    margin: 0;
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 400;
    font-size: 19px;
    letter-spacing: 0.01em;
    color: var(--mist);
  }
  .brand p {
    margin: 0;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .controls { display: flex; gap: 8px; flex: none; }
  .icon-btn {
    pointer-events: auto;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(23, 27, 56, 0.6);
    color: var(--mist);
    display: grid;
    place-items: center;
    cursor: pointer;
    flex: none;
  }
  .icon-btn:active { background: rgba(23, 27, 56, 0.9); }
  .icon-btn:focus-visible, .drawer button:focus-visible, .drawer input:focus-visible {
    outline: 2px solid var(--dawn);
    outline-offset: 2px;
  }
  .icon-btn svg { width: 20px; height: 20px; transition: transform 0.35s ease; }
  .icon-btn.ccw svg { transform: scaleX(-1); }
  .bottombar { display: flex; justify-content: center; }
  .hint {
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--muted);
    text-align: center;
    margin: 0;
  }
  .caption {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    margin: 0;
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 300;
    font-size: 24px;
    letter-spacing: 0.01em;
    color: var(--mist);
    text-align: center;
    white-space: nowrap;
    pointer-events: none;
    transition: opacity 0.7s ease;
  }
  .drawer {
    pointer-events: auto;
    position: fixed;
    top: calc(max(14px, env(safe-area-inset-top, 0px)) + 54px);
    right: max(16px, env(safe-area-inset-right, 0px));
    width: min(320px, calc(100% - 32px));
    max-height: calc(100% - max(14px, env(safe-area-inset-top, 0px)) - max(14px, env(safe-area-inset-bottom, 0px)) - 70px);
    overflow-y: auto;
    touch-action: pan-y;
    background: var(--panel);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px 16px;
    display: grid;
    gap: 14px;
    -webkit-user-select: auto;
    user-select: auto;
  }
  .drawer h2 {
    margin: 0;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .group { display: grid; gap: 10px; }
  .row { display: grid; gap: 4px; }
  .row-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    font-size: 13px;
    color: var(--ink);
  }
  .row-head output {
    font-variant-numeric: tabular-nums;
    color: var(--dawn);
    font-size: 12px;
    text-align: right;
  }
  .row input[type="range"] { width: 100%; accent-color: var(--dawn); margin: 0; height: 22px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions button {
    flex: 1 1 120px;
    min-height: 38px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--night-raised);
    color: var(--ink);
    font: 500 13px var(--font-ui);
    cursor: pointer;
  }
  .actions button.primary { background: var(--dawn); color: var(--night); border-color: transparent; }
  .engine { margin: 0; font-size: 11px; color: var(--muted); }
  .error {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    text-align: center;
    color: var(--mist);
    font-size: 15px;
  }
  @media (prefers-reduced-motion: reduce) {
    .caption { transition: none; }
  }
</style>

<canvas class="sky" id="sky" role="img" aria-label="A glowing rounded rectangle. Trace it with your finger: breathe in along the top and bottom, breathe out down the sides."></canvas>

<div class="ui">
  <div class="topbar">
    <div class="brand">
      <h1>Rainbow Breath</h1>
      <p>trace the loop with your breath</p>
    </div>
    <div class="controls">
      <button class="icon-btn" id="direction" type="button" aria-label="Reverse direction" aria-pressed="false" title="Clockwise. Tap to reverse.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="7" width="16" height="12" rx="3"/><path d="M10.5 4.5L13 7l-2.5 2.5"/>
        </svg>
      </button>
      <button class="icon-btn" id="restart-now" type="button" aria-label="Start over" title="Start over">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v3.7h3.7"/>
        </svg>
      </button>
      <button class="icon-btn" id="tune" type="button" aria-label="Tuning" title="Tuning" aria-expanded="false" aria-controls="drawer" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="bottombar"><p class="hint" id="hint"></p></div>
</div>

<p class="caption" id="caption" aria-live="polite"></p>

<section class="drawer" id="drawer" aria-label="Tuning" hidden>
  <p class="engine">Developer tuning. Changes are saved on this device only; visitors always get the built-in values. Use Copy tuning to send values to make them the default.</p>
  <div class="group" id="group-breath"><h2>Breathing</h2></div>
  <div class="group" id="group-shape"><h2>Shape</h2></div>
  <div class="group" id="group-light"><h2>Light</h2></div>
  <div class="actions">
    <button type="button" class="primary" id="restart">Start over</button>
    <button type="button" id="reset">Reset tuning</button>
    <button type="button" id="copy-tuning">Copy tuning</button>
  </div>
  <p class="engine" id="engine"></p>
</section>

<script>
(() => {
  "use strict";

  // ---------- the loop ----------
  // Four separate tubes round a rectangle, traced clockwise from the left end of the top tube:
  // top = in-breath, right = out-breath, bottom = in-breath, left = out-breath. The gaps at the
  // corners mark where the breath changes. Each tube's length is proportional to its breath time,
  // so the light moves at one steady speed.
  // Colours (linear RGB, from the Unreal rainbow) run around the loop as a gradient.
  const PALETTE = [
    [1.0, 0.0, 0.0], [0.8, 0.187, 0.0], [0.8, 0.643, 0.0], [0.0, 0.8, 0.002],
    [0.0, 0.289, 0.8], [0.0, 0.0143, 0.8], [0.244, 0.0, 0.8],
  ];

  const DEFAULTS = {
    inhale: 4, exhale: 5, hoverScale: 2.5, lead: 0.8, trail: 0.92,
    size: 0.92, thickness: 0.12, gap: 0.4,
    glow: 1.0, edgeSoft: 0.1, startCue: 0.35, glitter: 1.0, flakeSize: 0.06, flakeDensity: 3, flakeLayers: 4, twinkle: 0.4,
  };
  const FIXED = {
    edgeWidth: 0.035,     // glowing head width, fraction of the loop
    edgeGlow: 2.0, dim: 0.35, cueRamp: 0.03, drift: 0.15, whiteness: 0.6, halo: 0.8,
    drainSeconds: 1.2,
  };
  const CONTROLS = [
    { group: "breath", key: "inhale", label: "Breathe in (top and bottom)", min: 2, max: 10, step: 0.5, fmt: (v) => v.toFixed(1) + " s" },
    { group: "breath", key: "exhale", label: "Breathe out (sides)", min: 2, max: 12, step: 0.5, fmt: (v) => v.toFixed(1) + " s" },
    { group: "breath", key: "hoverScale", label: "Finger zone", min: 1, max: 5, step: 0.1, fmt: (v) => v.toFixed(1) + "×" },
    { group: "breath", key: "lead", label: "Light runs ahead of finger by", min: 0, max: 3, step: 0.1, fmt: (v) => v.toFixed(1) + " tube widths" },
    { group: "breath", key: "trail", label: "Glow lasts for", min: 0.3, max: 1, step: 0.01, fmt: (v) => Math.round(v * 100) + "% of a lap" },
    { group: "shape", key: "size", label: "Size", min: 0.5, max: 1, step: 0.01, fmt: (v) => Math.round(v * 100) + "%" },
    { group: "shape", key: "thickness", label: "Tube thickness", min: 0.05, max: 0.18, step: 0.005, fmt: (v) => (v * 100).toFixed(1) + "% of screen" },
    { group: "shape", key: "gap", label: "Corner gap", min: 0.1, max: 1.5, step: 0.05, fmt: (v) => v.toFixed(2) + " tube widths" },
    { group: "light", key: "glow", label: "Glow", min: 0, max: 3, step: 0.05, fmt: (v) => v.toFixed(2) },
    { group: "light", key: "edgeSoft", label: "Front softness", min: 0.02, max: 0.3, step: 0.01, fmt: (v) => Math.round(v * 100) + "% of a lap" },
    { group: "light", key: "startCue", label: "Start hint", min: 0, max: 1, step: 0.05, fmt: (v) => Math.round(v * 100) + "%" },
    { group: "light", key: "glitter", label: "Glitter", min: 0, max: 3, step: 0.05, fmt: (v) => v.toFixed(2) },
    // curve > 1 gives the slider finer steps at the low end
    { group: "light", key: "flakeSize", label: "Flake size", min: 0.005, max: 0.15, curve: 2, fmt: (v) => (v * 200).toFixed(v < 0.05 ? 1 : 0) + "% of tube width" },
    { group: "light", key: "flakeDensity", label: "Flake density", min: 1, max: 8, step: 0.5, fmt: (v) => v.toFixed(1) },
    { group: "light", key: "flakeLayers", label: "Flake layers", min: 1, max: 6, step: 1, fmt: (v) => String(Math.round(v)) },
    { group: "light", key: "twinkle", label: "Flake spin", min: 0, max: 1.5, curve: 2, fmt: (v) => v.toFixed(v < 0.1 ? 3 : 2) + " turns/s" },
  ];

  const STORE_KEY = "rainbow-breath-tuning-v2";
  const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  // developer mode (?dev, or #dev on the artifact link) shows the tuning drawer; the shared link always uses DEFAULTS
  const DEV = /[?&#]dev\b/i.test(location.search + location.hash);

  function loadSettings() {
    const s = { ...DEFAULTS };
    if (!DEV) return s;
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        const saved = JSON.parse(raw);
        for (const k of Object.keys(DEFAULTS)) if (typeof saved[k] === "number" && isFinite(saved[k])) s[k] = saved[k];
        for (const c of CONTROLS) s[c.key] = Math.min(c.max, Math.max(c.min, s[c.key]));
      }
    } catch (e) { /* storage unavailable - defaults are fine */ }
    return s;
  }
  function saveSettings() {
    if (!DEV) return;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* ignore */ }
  }
  let S = loadSettings();

  // ---------- game state ----------
  // T = how far the light has travelled, in laps (keeps growing); the glow trail fades behind it.
  const game = { T: 0, started: false, draining: 0, fade: 1, pendingDir: 0 };
  function restart() { game.draining = FIXED.drainSeconds; }
  const lapSeconds = () => 2 * (S.inhale + S.exhale);

  // travel direction: clockwise by default; anticlockwise mirrors the loop left-to-right (remembered per device)
  const DIR_KEY = "rainbow-breath-direction";
  let dirSign = 1;
  try { if (localStorage.getItem(DIR_KEY) === "ccw") dirSign = -1; } catch (e) { /* storage unavailable */ }

  // ---------- layout (CSS pixels) ----------
  let L = null;
  const probe = document.createElement("div");
  probe.style.cssText = "position:fixed;inset:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)";
  document.body.appendChild(probe);
  function readInsets() {
    const cs = getComputedStyle(probe);
    return { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
  }
  // px per second of breath that fits the four tubes into an AW x AH box.
  // Each tube ends `g` short of its corner, so neighbouring rounded ends leave a gap of S.gap tube widths.
  function fitSpeed(AW, AH) {
    const w = S.thickness * Math.min(AW, AH), g = (w + S.gap * w) / Math.SQRT2;
    return { w, g, k: Math.min((AW - 2 * g - w) / S.inhale, (AH - 2 * g - w) / S.exhale) };
  }
  function computeLayout() {
    const W = window.innerWidth, Hh = window.innerHeight, ins = readInsets();
    const m = 14;
    // leave room for the title and buttons only on narrow screens, where the loop could reach them
    const left = ins.l + m, right = W - ins.r - m, top = ins.t + m + (W < 700 ? 44 : 0), bottom = Hh - ins.b - m - (W < 700 ? 18 : 0);
    const AW = Math.max(60, right - left), AH = Math.max(60, bottom - top);
    const f = fitSpeed(AW, AH);
    const k = Math.max(1, f.k * S.size);
    const lt = k * S.inhale, ls = k * S.exhale;   // top/bottom and side tube lengths
    const X = lt / 2 + f.g, Y = ls / 2 + f.g;      // corner points of the rectangle (centre lines)
    L = { cx: left + AW / 2, cy: top + AH / 2, X, Y, g: f.g, w: f.w, lt, ls, len: 2 * lt + 2 * ls };
    // the four tubes in travel order, relative to the centre: start point, direction, length, offset along the loop
    L.tubes = [
      { ax: -X + f.g, ay: -Y, dx: 1, dy: 0, len: lt, off: 0 },             // top: breathe in
      { ax: X, ay: -Y + f.g, dx: 0, dy: 1, len: ls, off: lt },             // right: breathe out
      { ax: X - f.g, ay: Y, dx: -1, dy: 0, len: lt, off: lt + ls },        // bottom: breathe in
      { ax: -X, ay: Y - f.g, dx: 0, dy: -1, len: ls, off: 2 * lt + ls },   // left: breathe out
    ];
    // on a phone, suggest turning it if the loop would be much bigger the other way round
    const turned = fitSpeed(AH, AW);
    L.turnHint = navigator.maxTouchPoints > 0 && turned.k > 1.3 * f.k
      ? (W > Hh ? "Turn your phone upright for a bigger loop" : "Turn your phone sideways for a bigger loop") : "";
    placeCaption();
  }

  // nearest tube to a point (relative to the centre): distance from its centre line, and loop position in px
  function nearestTube(px, py) {
    px *= dirSign;
    let best = null;
    for (const tb of L.tubes) {
      const t = Math.max(0, Math.min(tb.len, (px - tb.ax) * tb.dx + (py - tb.ay) * tb.dy));
      const dist = Math.hypot(px - (tb.ax + tb.dx * t), py - (tb.ay + tb.dy * t));
      if (!best || dist < best.dist) best = { dist, x: tb.off + t };
    }
    return best;
  }
  // loop position (0..1) measured from the start of the top tube
  function loopPos(dx, dy) {
    return nearestTube(dx, dy).x / L.len;
  }
  // screen point (CSS px) on the tubes' centre lines at loop position f (laps)
  function pointAtLoop(f) {
    const s = (((f % 1) + 1) % 1) * L.len;
    for (const tb of L.tubes) {
      if (s <= tb.off + tb.len) { const t = s - tb.off; return [L.cx + dirSign * (tb.ax + tb.dx * t), L.cy + tb.ay + tb.dy * t]; }
    }
    return [L.cx + dirSign * L.tubes[0].ax, L.cy + L.tubes[0].ay];
  }
  // where to draw the head's round glow: like pointAtLoop, but it slides smoothly across a corner gap
  // instead of jumping from the end of one tube to the start of the next
  function headPoint(f) {
    const s = (((f % 1) + 1) % 1) * L.len, win = 0.8 * L.w;
    for (let i = 0; i < 4; i++) {
      let ds = s - L.tubes[i].off; // distance past the start of tube i (= the end of the tube before it)
      if (ds > L.len / 2) ds -= L.len;
      if (ds < -L.len / 2) ds += L.len;
      if (Math.abs(ds) < win) {
        const prev = L.tubes[(i + 3) % 4], next = L.tubes[i];
        const tp = Math.max(0, Math.min(prev.len, prev.len + ds)), tn = Math.max(0, Math.min(next.len, ds));
        const ax = prev.ax + prev.dx * tp, ay = prev.ay + prev.dy * tp;
        const bx = next.ax + next.dx * tn, by = next.ay + next.dy * tn;
        const u = Math.min(1, Math.max(0, (ds + win) / (2 * win))), k = u * u * (3 - 2 * u);
        return [L.cx + dirSign * (ax + (bx - ax) * k), L.cy + ay + (by - ay) * k];
      }
    }
    return pointAtLoop(f);
  }
  // which breath a loop position belongs to: top and bottom tubes are in-breaths, the sides out-breaths
  function isInhaleAt(f) {
    const s = f * L.len;
    return s < L.lt || (s >= L.lt + L.ls && s < 2 * L.lt + L.ls);
  }

  // ---------- canvas + renderers ----------
  let canvas = document.getElementById("sky");
  let dpr = 1;
  function resizeCanvas() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.round(window.innerWidth * dpr));
    canvas.height = Math.max(1, Math.round(window.innerHeight * dpr));
    computeLayout();
  }

  const WGSL = /* wgsl */ `
struct Uniforms { v : array<vec4f, 16> };
@group(0) @binding(0) var<uniform> U : Uniforms;

@vertex
fn vs(@builtin(vertex_index) vi : u32) -> @builtin(position) vec4f {
  var pos = array<vec2f, 3>(vec2f(-1.0, -3.0), vec2f(-1.0, 1.0), vec2f(3.0, 1.0));
  return vec4f(pos[vi], 0.0, 1.0);
}

fn hash12(p : vec2f) -> f32 {
  var p3 = fract(vec3f(p.x, p.y, p.x) * 0.1031);
  p3 = p3 + dot(p3, p3.yzx + vec3f(33.33));
  return fract((p3.x + p3.y) * p3.z);
}
fn hash22(p : vec2f) -> vec2f {
  var p3 = fract(vec3f(p.x, p.y, p.x) * vec3f(0.1031, 0.1030, 0.0973));
  p3 = p3 + dot(p3, p3.yzx + vec3f(33.33));
  return fract((p3.xx + p3.yz) * p3.zy);
}
fn sstep(x : f32) -> f32 { let c = clamp(x, 0.0, 1.0); return c * c * (3.0 - 2.0 * c); }

// One layer of glitter: most cells hold one flake placed anywhere in the cell (some cells stay empty,
// so no grid shows). Each flake is a small square tumbling about all three axes, projected onto the
// screen. The 2x2 cells nearest to g are checked, so flakes may cross cell borders.
// Returns (coverage, glint); the glint flashes when a flake's face lines up with the light.
fn flakeLayer(g : vec2f, seed : f32, t : f32, twk : f32, sizeCells : f32, pxCell : f32) -> vec2f {
  let base = floor(g - vec2f(0.5));
  let hv = normalize(normalize(vec3f(-0.35, -0.55, 1.0)) + vec3f(0.0, 0.0, 1.0));
  var cover = 0.0;
  var glint = 0.0;
  for (var j = 0; j < 4; j = j + 1) {
    let cell = base + vec2f(f32(j % 2), f32(j / 2));
    let h0 = hash22(cell + vec2f(seed, 5.0));
    if (h0.x > 0.72) { continue; }
    let h1 = hash22(cell + vec2f(seed, 3.0));
    let h2 = hash22(cell + vec2f(seed * 1.7, 11.0));
    let q = g - (cell + h1);

      name: "WebGL 2",
      draw() {
        gl.viewport(0, 0, cv.width, cv.height);
        gl.useProgram(prog);
        gl.bindVertexArray(vao);
        gl.uniform4fv(loc, U);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      },
    };
  }

  function freshCanvas() {
    const next = canvas.cloneNode(false);
    canvas.replaceWith(next);
    canvas = next;
    resizeCanvas();
  }

  async function initRenderer() {
    const forceGL = /webgl/i.test(location.search);
    if (!forceGL && navigator.gpu) {
      try {
        const r = await initWebGPU(canvas);
        if (r) return r;
      } catch (e) { console.warn("WebGPU unavailable, falling back", e); }
      freshCanvas(); // a canvas can only hold one kind of context
    }
    return initWebGL2(canvas);
  }

  // ---------- input: finger first, mouse for desktop testing ----------
  const pointer = { present: false, x: 0, y: 0, id: null };
  let wakeLock = null;
  function requestWakeLock() {
    if (!navigator.wakeLock || wakeLock) return;
    navigator.wakeLock.request("screen").then((l) => { wakeLock = l; l.addEventListener("release", () => { wakeLock = null; }); }).catch(() => {});
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && game.started) requestWakeLock(); });

  function bindInput(cv) {
    cv.addEventListener("pointerdown", (e) => {
      if (e.pointerType !== "mouse") {
        // follow the first finger only; a new primary touch always takes over (recovers from a missed lift)
        if (pointer.id !== null && pointer.id !== e.pointerId && !e.isPrimary) return;
        pointer.id = e.pointerId;
        try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      }
      pointer.present = true;
      pointer.x = e.clientX;
      pointer.y = e.clientY;
      game.started = true;
      requestWakeLock();
    });
    cv.addEventListener("pointermove", (e) => {
      if (e.pointerType === "mouse") { pointer.present = true; pointer.x = e.clientX; pointer.y = e.clientY; return; }
      if (e.pointerId === pointer.id) { pointer.x = e.clientX; pointer.y = e.clientY; }
    });
    const lift = (e) => {
      if (e.pointerType === "mouse") return;
      if (e.pointerId === pointer.id) { pointer.present = false; pointer.id = null; }
    };
    cv.addEventListener("pointerup", lift);
    cv.addEventListener("pointercancel", lift);
    cv.addEventListener("lostpointercapture", lift);
    cv.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") pointer.present = false; });
    cv.addEventListener("contextmenu", (e) => e.preventDefault());
    const release = () => { pointer.present = false; pointer.id = null; };
    window.addEventListener("blur", release);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState !== "visible") release(); });
  }

  // true when the pointer is inside the forgiving band around any of the tubes
  function isNear() {
    if (!pointer.present || !L) return false;
    return nearestTube(pointer.x - L.cx, pointer.y - L.cy).dist <= 0.5 * L.w * S.hoverScale;
  }
  // travel target that puts the glowing front just ahead of the finger, so the finger never hides it
  function followTarget() {
    const f = loopPos(pointer.x - L.cx, pointer.y - L.cy);
    let delta = f - (game.T - Math.floor(game.T));
    delta -= Math.round(delta); // nearest way round, in -0.5..0.5 laps
    return game.T + delta + (S.lead * L.w) / L.len + 0.5 * S.edgeSoft;
  }

  // ---------- update ----------
  function update(dt) {
    if (game.draining > 0) {
      game.draining -= dt;
      game.fade = Math.max(0, game.draining / FIXED.drainSeconds);
      if (game.draining <= 0) {
        game.T = 0;
        game.fade = 1;
        if (game.pendingDir) { dirSign = game.pendingDir; game.pendingDir = 0; }
      }
      return;
    }
    // the light follows the finger round the loop, but never faster than the breath
    if (isNear()) {
      const target = followTarget();
      if (target > game.T) game.T = Math.min(target, game.T + dt / Math.max(lapSeconds(), 1));
    }
  }

  function packUniforms(time) {
    const k = dpr, len = L.len;
    const frac = game.T - Math.floor(game.T);
    U.set([canvas.width, canvas.height, time, k], 0);
    U.set([L.cx * k, L.cy * k, L.X * k, L.Y * k], 4);
    U.set([L.g * k, L.w * k, len * k, frac * len * k], 8);
    U.set([Math.min(game.T, 2) * len * k, S.edgeSoft * len * k, FIXED.edgeWidth * len * k, S.trail * len * k], 12);
    U.set([S.glow, FIXED.edgeGlow, FIXED.dim, S.startCue], 16);
    U.set([FIXED.cueRamp * len * k, S.glitter, S.flakeSize, S.flakeDensity], 20);
    U.set([reduceMotion ? S.twinkle * 0.4 : S.twinkle, reduceMotion ? 0 : FIXED.drift, FIXED.whiteness, FIXED.halo], 24);
    U.set([S.flakeLayers, game.fade, L.lt * k, L.ls * k], 28);
    for (let i = 0; i < PALETTE.length; i++) U.set([PALETTE[i][0], PALETTE[i][1], PALETTE[i][2], 0], 32 + i * 4);
    const hf = headPos(), hxy = headPoint(hf);
    U.set([hxy[0] * k, hxy[1] * k, hf * len * k, dirSign], 60);
  }

  // ---------- captions ----------
  const captionEl = document.getElementById("caption");
  const hintEl = document.getElementById("hint");
  let shownCaption = null, pendingCaption = null, captionTimer = 0;
  // where the glowing head is (laps); like the shader, it sits on the start point until tracing begins
  function headPos() {
    const lag = 0.5 * S.edgeSoft * Math.min(1, game.T / (0.5 * S.edgeSoft));
    return ((game.T - lag) % 1 + 1) % 1;
  }
  function wantedCaption() {
    if (game.draining > 0) return "";
    if (!game.started) return "Trace the glow · breathe in";
    return isInhaleAt(headPos()) ? "breathe in" : "breathe out";
  }
  // centre the caption inside the loop, shrinking the font until it fits the opening
  function placeCaption() {
    if (!L) return;
    const roomW = 2 * L.X - L.w - 24, roomH = 2 * L.Y - L.w - 16;
    let size = Math.min(30, Math.max(16, Math.min(window.innerWidth, window.innerHeight) * 0.055));
    captionEl.style.top = L.cy + "px";
    for (let tries = 0; tries < 8; tries++) {
      captionEl.style.fontSize = size.toFixed(1) + "px";
      const r = captionEl.getBoundingClientRect();
      if (r.width <= roomW && r.height <= roomH) return;
      size *= 0.88;
    }
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeCaption);
  function updateCaption() {
    const want = wantedCaption();
    if (want !== shownCaption && want !== pendingCaption) {
      pendingCaption = want;
      captionEl.style.opacity = "0";
      clearTimeout(captionTimer);
      captionTimer = setTimeout(() => {
        shownCaption = pendingCaption;
        pendingCaption = null;
        captionEl.textContent = shownCaption;
        placeCaption();
        captionEl.style.opacity = shownCaption ? "1" : "0";
      }, reduceMotion ? 0 : 450);
    }
    const hint = L ? L.turnHint : "";
    if (hintEl.textContent !== hint) hintEl.textContent = hint;
  }

  // ---------- tuning drawer ----------
  const drawer = document.getElementById("drawer");
  const tuneBtn = document.getElementById("tune");
  const outputs = {};
  function buildControls() {
    for (const c of CONTROLS) {
      const row = document.createElement("div");
      row.className = "row";
      const id = "ctl-" + c.key;
      // curved sliders run 0..1000 internally and map through value = min + range * pos^curve
      const curve = c.curve || 1;
      const toPos = (v) => (curve === 1 ? v : Math.round(1000 * Math.pow((v - c.min) / (c.max - c.min), 1 / curve)));
      const fromPos = (p) => (curve === 1 ? p : c.min + (c.max - c.min) * Math.pow(p / 1000, curve));
      const range = curve === 1 ? 'min="' + c.min + '" max="' + c.max + '" step="' + c.step + '"' : 'min="0" max="1000" step="1"';
      row.innerHTML = '<div class="row-head"><label for="' + id + '"></label><output for="' + id + '"></output></div>' +
        '<input type="range" id="' + id + '" ' + range + '>';
      row.querySelector("label").textContent = c.label;
      const input = row.querySelector("input");
      const out = row.querySelector("output");
      input.value = String(toPos(S[c.key]));
      out.textContent = c.fmt(S[c.key]);
      outputs[c.key] = { input, out, fmt: c.fmt, toPos };
      input.addEventListener("input", () => {
        S[c.key] = fromPos(parseFloat(input.value));
        out.textContent = c.fmt(S[c.key]);
        saveSettings();
        // breath timings and shape settings both reshape the loop
        if (c.group === "shape" || c.key === "inhale" || c.key === "exhale") computeLayout();
      });
      document.getElementById("group-" + c.group).appendChild(row);
    }
  }
  function syncControls() {
    for (const k of Object.keys(outputs)) {
      outputs[k].input.value = String(outputs[k].toPos(S[k]));
      outputs[k].out.textContent = outputs[k].fmt(S[k]);
    }
  }
  tuneBtn.addEventListener("click", () => {
    drawer.hidden = !drawer.hidden;
    tuneBtn.setAttribute("aria-expanded", String(!drawer.hidden));
  });
  document.getElementById("restart").addEventListener("click", () => { restart(); });
  document.getElementById("restart-now").addEventListener("click", () => { restart(); });
  // direction toggle: the icon's arrow points the way the light travels along the top tube
  const dirBtn = document.getElementById("direction");
  function showDirection() {
    const ccw = (game.pendingDir || dirSign) < 0;
    dirBtn.classList.toggle("ccw", ccw);
    dirBtn.setAttribute("aria-pressed", String(ccw));
    dirBtn.title = (ccw ? "Anticlockwise" : "Clockwise") + ". Tap to reverse.";
  }
  dirBtn.addEventListener("click", () => {
    // the new direction takes over once the current glow has faded, so the trail never jumps sides
    game.pendingDir = -(game.pendingDir || dirSign);
    try { localStorage.setItem(DIR_KEY, game.pendingDir < 0 ? "ccw" : "cw"); } catch (e) { /* ignore */ }
    showDirection();
    restart();
  });
  showDirection();
  document.getElementById("reset").addEventListener("click", () => { S = { ...DEFAULTS }; saveSettings(); syncControls(); computeLayout(); });
  const copyBtn = document.getElementById("copy-tuning");
  copyBtn.addEventListener("click", () => {
    const text = JSON.stringify(S);
    const done = (label) => { copyBtn.textContent = label; setTimeout(() => { copyBtn.textContent = "Copy tuning"; }, 1800); };
    const fallback = () => { document.getElementById("engine").textContent = text; done("Select the text below"); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => done("Copied"), fallback);
    else fallback();
  });
  buildControls();
  if (DEV) tuneBtn.hidden = false;

  // ---------- run ----------
  let renderer = null, last = 0, time = 0;
  function frame(now) {
    const dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
    last = now;
    time = (time + dt) % 10000;
    update(dt);
    packUniforms(time);
    renderer.draw();
    updateCaption();
    requestAnimationFrame(frame);
  }

  async function start(saved) {
    if (saved && saved.game && typeof saved.game.T === "number") Object.assign(game, saved.game);
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);
    renderer = await initRenderer();
    if (!renderer) {
      const msg = document.createElement("p");
      msg.className = "error";
      msg.textContent = "This browser can't draw the loop. It needs WebGPU or WebGL 2, which recent Safari, Chrome and Firefox all have.";
      document.body.appendChild(msg);
      return;
    }
    document.getElementById("engine").textContent = "Drawing with " + renderer.name + " at " + dpr.toFixed(1) + "× pixel density.";
    bindInput(canvas);
    requestAnimationFrame(frame);
  }

  // local testing only (?test in the URL): advance the game clock without waiting for animation frames
  if (/[?&]test\b/.test(location.search)) {
    window.__rainbow = {
      step(seconds, dt = 1 / 60) { for (let t = 0; t < seconds; t += dt) update(dt); updateCaption(); return this.state(); },
      state: () => ({ T: +game.T.toFixed(4), lap: Math.floor(game.T), started: game.started, draining: game.draining,
        headInhale: isInhaleAt(headPos()), dir: dirSign, pendingDir: game.pendingDir }),
      head: (f = headPos()) => headPoint(f),
      near: () => isNear(),
      layout: () => L,
      loopPos: (x, y) => loopPos(x - L.cx, y - L.cy),
      pointAt: (f) => pointAtLoop(f),
      settings: () => S,
    };
  }

  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === "function") hot.snapshot(() => ({ game: JSON.parse(JSON.stringify(game)) }));
  if (hot && typeof hot.ready === "function") hot.ready(start);
  else start(hot && hot.data ? hot.data : {});
})();
</script>
